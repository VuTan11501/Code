name: Timesheet Action

# Drives the DokoKin monthly-timesheet Calculate (計算) + Save Draft (一時保存)
# actions for one month. Dispatched on-demand from the PWA "Timesheet" tab.
#
# Safety (enforced in gh_timesheet_action.py, not here):
#   • Only ever Save Draft (status stays 1). NEVER Submit (申請).
#   • Round-trips the server's OWN month object — never hand-builds payload.
#   • Hard-refuses non-Draft / leader-or-HR-confirmed months (FORCE can't bypass).
#   • Anomaly guard blocks save on missing checkout / invalid working-place /
#     invalid break; FORCE=1 overrides ONLY that guard.
#   • calc-save saves ONLY if /calculate succeeded with a validated response.

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: "Action type (timesheet | working_time_change)"
        required: true
        default: "timesheet"
        type: choice
        options:
          - timesheet
          - working_time_change
      # Timesheet inputs
      action:
        description: "[Timesheet] calculate | save | calc-save"
        required: false
        default: "calc-save"
        type: choice
        options:
          - calc-save
          - calculate
          - save
      year:
        description: "[Timesheet] Year (default: current JST year)"
        required: false
        default: ""
      month:
        description: "[Timesheet] Month 1-12 (default: current JST month)"
        required: false
        default: ""
      account:
        description: "[Timesheet] DokoKin account (default: tanvc)"
        required: false
        default: "tanvc"
      dry_run:
        description: "[Timesheet] Do everything except the final POST /save"
        required: false
        type: boolean
        default: false
      force:
        description: "[Timesheet] Override the anomaly guard ONLY (not the status gate)"
        required: false
        type: boolean
        default: false
      # Working Time Change inputs
      date:
        description: "[Working Time Change] Date (YYYY-MM-DD)"
        required: false
        default: ""
      new_end_time:
        description: "[Working Time Change] New checkout time (HH:mm)"
        required: false
        default: ""
      new_end_next_day:
        description: "[Working Time Change] Is new time on next day? (true/false)"
        required: false
        default: "false"
      reason:
        description: "[Working Time Change] Reason / notes"
        required: false
        default: ""

permissions:
  contents: read

env:
  TZ: Asia/Tokyo

concurrency:
  # Serialize per month so two dispatches never race a save.
  group: timesheet-action-${{ github.event.inputs.year }}-${{ github.event.inputs.month }}
  cancel-in-progress: false

jobs:
  timesheet_action:
    if: github.event.inputs.action_type == 'timesheet'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts

      - name: Run timesheet action
        env:
          AZURE_REFRESH_TOKEN: ${{ secrets.AZURE_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          # Per-domain Gist shard with fallback chain to legacy single gist.
          GIST_ID: ${{ vars.GIST_ID || 'abc2a47c0a396025a72a6580227ff493' }}
          GIST_ID_TIMESHEET: ${{ vars.GIST_ID_TIMESHEET || vars.GIST_ID || 'abc2a47c0a396025a72a6580227ff493' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          ACTION: ${{ inputs.action || 'calc-save' }}
          YEAR: ${{ inputs.year || '' }}
          MONTH: ${{ inputs.month || '' }}
          ACCOUNT: ${{ inputs.account || 'tanvc' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FORCE: ${{ inputs.force && '1' || '' }}
        # Use the runner's preinstalled Python 3.12 (script is stdlib-only) —
        # skipping actions/setup-python saves ~15-25s of cold-start per run.
        run: python3 .github/scripts/gh_timesheet_action.py
      # Phase 3: token rotation is queued into Gist pending_token_rotation.json
      # and applied centrally by token-monitor.yml.

  working_time_change:
    if: github.event.inputs.action_type == 'working_time_change'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Tokyo
      EMPLOYEE_ID: '8883'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts

      - name: Update working time via DokoKin
        id: update
        env:
          AZURE_REFRESH_TOKEN: ${{ secrets.AZURE_REFRESH_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          # original_end_time is fetched server-side from the live dakoku
          # record (displayEndWorkingTime) inside the Python worker itself.
          INPUT_NEW_END_TIME: ${{ github.event.inputs.new_end_time }}
          INPUT_NEW_END_NEXT_DAY: ${{ github.event.inputs.new_end_next_day }}
          INPUT_REASON: ${{ github.event.inputs.reason }}
        run: |
          cd $GITHUB_WORKSPACE/.github/scripts
          python3 dokokin_working_time_change.py

      - name: Notify completion
        if: always()
        run: |
          STATUS=${{ steps.update.outputs.status }}
          if [ "$STATUS" = "success" ]; then
            echo "✅ Working time change submitted"
            echo "New hours: ${{ steps.update.outputs.new_hours }}"
            echo "New gross: ¥${{ steps.update.outputs.new_gross }}"
          else
            echo "❌ Failed: ${{ steps.update.outputs.error }}"
            exit 1
          fi
