name: Payslip Fetch

# Pulls the user's monthly payslip from FJP Payroll API and stores it
# in the Gist file `payslip-history.json`. The PWA uses this for:
#   • Salary chip in Timesheet tab (real take-home for past months)
#   • Net take-home estimator in OT Planner tab (baseline payslip)
#
# Salary cycle:
#   Work done in month X (incl. all OT) is paid on day 22 of month X+1.
#   Primary run: 00:30 JST on day 23 — right after pay day, when the
#   payslip is guaranteed to be published. The script is idempotent —
#   already fetched months are skipped unless FORCE=1.
#   Safety net: 12:00 JST on days 22-28 — catches payslips published
#   during day 22 (before the primary run) and retries if the primary
#   run was skipped (GitHub cron is not reliable).

on:
  workflow_dispatch:
    inputs:
      year_month:
        description: 'Target month "YYYY-MM" (default: current JST month)'
        required: false
        default: ""
      months_back:
        description: "Also backfill this many earlier months (0 = just target)"
        required: false
        default: "0"
      force:
        description: "Overwrite existing entries"
        required: false
        type: boolean
        default: false
  schedule:
    # Primary: 15:30 UTC on day 22 = 00:30 JST on day 23 — right after
    # pay day (salary lands on day 22), the payslip is published by then.
    # Deliberately NOT 00:00/00:15 JST: that would start in the same
    # minute as Timesheet Fetch / OT History Fetch, which share the same
    # Azure refresh token and Gist (secondary rate limit / rotation
    # race — see KNOWLEDGE.md §3.22/§3.34).
    # (GitHub Actions cron is UTC-only — there is no workflow-level
    # 'timezone' keyword; JST is fixed UTC+9 with no DST, so the offset
    # is exact year-round.)
    - cron: "30 15 22 * *"
    # Safety net: 03:00 UTC = 12:00 JST on days 22..28 of each month.
    # Day 22 = pay date (payslip may appear mid-day, before the primary
    # run). Subsequent days are retries in case the payslip was delayed
    # or a scheduled run was skipped by GitHub.
    - cron: "0 3 22-28 * *"

permissions:
  contents: read

env:
  TZ: Asia/Tokyo

concurrency:
  # Shared gist-write group — see ot-history-fetch.yml for the rationale.
  group: gist-write
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts

      - name: Run payslip fetch
        id: fetch
        env:
          AZURE_REFRESH_TOKEN: ${{ secrets.AZURE_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          # Per-domain Gist shard with fallback chain to legacy single gist.
          GIST_ID: ${{ vars.GIST_ID || 'abc2a47c0a396025a72a6580227ff493' }}
          GIST_ID_PAYSLIP: ${{ vars.GIST_ID_PAYSLIP || vars.GIST_ID || 'abc2a47c0a396025a72a6580227ff493' }}
          FJP_PAYROLL_PASSCODE: ${{ secrets.FJP_PAYROLL_PASSCODE }}
          ACCOUNT: tanvc
          YEAR_MONTH: ${{ inputs.year_month || '' }}
          MONTHS_BACK: ${{ inputs.months_back || '0' }}
          FORCE: ${{ inputs.force && '1' || '' }}
        # Stdlib-only script; runner already has Python preinstalled.
        run: python3 .github/scripts/gh_payslip_fetch.py
      # Phase 3: token rotation is queued by the worker into Gist
      # pending_token_rotation.json and applied centrally by token-monitor.yml.
