name: OT History Fetch

# Pulls historical OT requests from DokoKin for the last N months and merges
# them into ot-requests.json (Gist). Useful for backfilling the dashboard
# with OT records created outside this automation.
#
# Runs daily at 00:15 JST (schedule) as a batch sync — the same pattern as
# Timesheet Fetch (00:00 JST). The 15-min offset keeps the two workers from
# hitting the same Gist / Azure refresh token in the same minute (secondary
# rate limit + rotation race, see KNOWLEDGE.md §3.22/§3.33). The merge is
# idempotent and never deletes user-created entries, so daily runs are safe.

on:
  workflow_dispatch:
    inputs:
      months_back:
        description: "How many months back to fetch (incl. current month)"
        required: false
        default: "24"
      clean_seeds:
        description: "Remove ot_seed* mock entries from Gist"
        required: false
        default: "true"
      fetch_timesheet:
        description: "Also fetch monthly timesheet aggregates for payslip cross-check"
        required: false
        default: "true"
  schedule:
    # 00:15 JST daily — right after day rollover, like Timesheet Fetch.
    - cron: "15 0 * * *"

# Cron expressions above are evaluated in JST (no DST — JST is fixed UTC+9).
timezone: Asia/Tokyo

permissions:
  contents: read

env:
  TZ: Asia/Tokyo

concurrency:
  group: ot-history-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts

      - name: Run OT history fetch
        id: fetch
        env:
          AZURE_REFRESH_TOKEN: ${{ secrets.AZURE_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          # `inputs.*` is empty on schedule runs — give every input an
          # explicit schedule default so the script never sees "".
          # Speed default: cron keeps a 6-month rolling window (older
          # months are immutable after payroll finalisation, and the merge
          # keeps older Gist entries). Full backfill stays a manual option.
          MONTHS_BACK: ${{ github.event_name == 'schedule' && '6' || (inputs.months_back || '24') }}
          CLEAN_SEEDS: ${{ github.event_name == 'schedule' && 'true' || (inputs.clean_seeds || 'true') }}
          FETCH_TIMESHEET: ${{ github.event_name == 'schedule' && 'true' || (inputs.fetch_timesheet || 'true') }}
          FETCH_WORKERS: "4"
        # Stdlib-only script; runner already has Python preinstalled.
        run: python3 .github/scripts/ot_history_fetch.py
      # Phase 3: token rotation is queued by the worker into Gist
      # pending_token_rotation.json and applied centrally by token-monitor.yml.
