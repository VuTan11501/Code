name: Auto Request OT

on:
  # Triggered by scheduled-dispatch.yml (Gist-based scheduler) at 10:00 JST daily.
  # Native cron removed for consistent timing via Gist dispatcher.
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Tokyo

concurrency:
  # Shared gist-write group — see ot-history-fetch.yml for the rationale.
  # (Previously had NO concurrency block at all, so it could freely race
  # OT History Fetch on ot-requests.json.)
  group: gist-write
  cancel-in-progress: false

jobs:
  create-ot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts

      - name: Run Auto Request OT
        id: ot_creator
        env:
          AZURE_REFRESH_TOKEN: ${{ secrets.AZURE_REFRESH_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GH_PAT: ${{ secrets.GH_PAT }}
        # Stdlib-only script; runner already has Python preinstalled.
        run: python3 .github/scripts/gh_ot_creator.py
      # Phase 3: token rotation is queued by the worker into Gist
      # pending_token_rotation.json and applied centrally by token-monitor.yml.
